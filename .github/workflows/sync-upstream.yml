name: Upstream Sync

on:
  schedule:
    - cron: '0 7 * * *'
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      sync_test_mode:
        description: Fork Sync Test Mode
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: false

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          target_sync_branch: develop
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_branch: develop
          upstream_sync_repo: https://github.com/gcivil-nyu-org/team-4-fall26
          test_mode: ${{ inputs.sync_test_mode || false }}

      - name: Report sync result
        if: steps.sync.outputs.has_new_commits == 'true'
        run: echo "New upstream commits were found and synced."

      - name: Report no changes
        if: steps.sync.outputs.has_new_commits == 'false'
        run: echo "No upstream commits needed syncing."
